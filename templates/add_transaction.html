{% extends "base.html" %}

{% block extra_css %}
<style>
    .autocomplete-container {
        position: relative;
        width: 100%;
    }

    #ticker-suggestions {
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        background: white;
        border: 1px solid #ddd;
        border-radius: 4px;
        max-height: 200px;
        overflow-y: auto;
        z-index: 1000;
        display: none;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .suggestion-item {
        padding: 8px 12px;
        cursor: pointer;
        border-bottom: 1px solid #eee;
    }

    .suggestion-item:hover {
        background: #007bff;
        color: white;
    }

    .suggestion-item.disabled {
        color: #999;
        cursor: default;
    }

    .suggestion-item.disabled:hover {
        background: none;
        color: #999;
    }
</style>
{% endblock %}

{% block content %}
<h2>➕ Добавить сделку</h2>

<div style="max-width: 500px; margin: 20px 0; background: white; padding: 30px; border-radius: 10px;">
    <form method="POST">
        <div style="margin-bottom: 15px;">
            <label>Портфель:</label>
            <select name="portfolio_id" style="width: 100%; padding: 8px; margin-top: 5px;">
                {% for portfolio in portfolios %}
                <option value="{{ portfolio.id }}" {% if selected|int == portfolio.id %}selected{% endif %}>
                    {{ portfolio.name }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div style="margin-bottom: 15px;">
            <label>Тикер:</label>
            <div class="autocomplete-container">
                <input type="text" id="ticker" name="ticker" required
                       style="width: 100%; padding: 8px; margin-top: 5px;"
                       placeholder="Например: SBER" autocomplete="off">
                <div id="ticker-suggestions"></div>
            </div>
            <small style="color: #666;">Введите минимум 2 символа</small>
        </div>

        <div style="margin-bottom: 15px;">
            <label>Количество:</label>
            <input type="number" step="1" name="quantity" required style="width: 100%; padding: 8px; margin-top: 5px;">
        </div>

        <div style="margin-bottom: 15px;">
            <label>Цена за штуку (₽):</label>
            <input type="number" step="0.01" name="price" required style="width: 100%; padding: 8px; margin-top: 5px;">
        </div>

        <div style="margin-bottom: 15px;">
            <label>Дата:</label>
            <input type="date" name="date" required style="width: 100%; padding: 8px; margin-top: 5px;">
        </div>

        <div style="margin-bottom: 15px;">
            <label>Комиссия (₽):</label>
            <input type="number" step="0.01" name="commission" value="0" style="width: 100%; padding: 8px; margin-top: 5px;">
        </div>

        <button type="submit" style="background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer;">Сохранить</button>
    </form>
</div>

<script src="{{ url_for('static', filename='js/autocomplete.js') }}"></script>
{% endblock %}
